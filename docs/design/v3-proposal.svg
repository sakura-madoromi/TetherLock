<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#475569"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#64748b" stroke-width="1"/></pattern>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#203047;font-size:16px}
      .small{font-size:13px}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}
      .dim{stroke:#475569;stroke-width:1.2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .leader{fill:none;stroke:#475569;stroke-width:1.2}.label{font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="1000" fill="#f6f8fc"/>
  <text x="40" y="42" class="title">TetherLock V3 · 结构方案草图</text>
  <text x="40" y="70">历史共轴布局 / 单位 mm / 非制造图 / 已发现承载问题；最新要求见同名 Markdown</text>
  <rect x="30" y="90" width="1140" height="485" rx="12" fill="white" stroke="#d8e0eb"/>
  <text x="50" y="124" class="head">闭合整机目标 240 × 120 × 55</text>
  <line x1="50" y1="155" x2="770" y2="155" class="dim"/><text x="393" y="148">240</text>
  <!-- Plan: X from -120 to +120; Y from -60 to +60; 3 px/mm -->
  <g transform="translate(0,100)">
    <rect x="50" y="80" width="720" height="360" rx="9" fill="#e4eaf3" stroke="#334155" stroke-width="2"/>
    <rect x="59" y="89" width="562.5" height="342" fill="#f4f8fc" stroke="#94a3b8"/>
    <rect x="621.5" y="89" width="9" height="342" fill="#475569"/>
    <rect x="630.5" y="89" width="130.5" height="342" fill="#f7f1e9"/>
    <rect x="59" y="89" width="562.5" height="15" fill="#b2c1d6"/>
    <circle cx="206" cy="95" r="9" fill="#52637c"/>
    <circle cx="506" cy="95" r="9" fill="#52637c"/>
    <text x="83" y="139" class="small">内收铰链 + 后部固定窄边框</text>
    <rect x="100" y="175" width="450" height="210" rx="5" fill="#e3eef9" stroke="#98b4d3" stroke-dasharray="7 5"/>
    <text x="238" y="267" class="head">储物仓</text>
    <text x="196" y="294">名义净长 187.5</text>
    <text x="161" y="321" class="small">目标物品包络 185 × 95 × 40</text>
    <rect x="692" y="98" width="60" height="213" rx="26" fill="#c7e6de" stroke="#1f8070" stroke-dasharray="6 3"/>
    <rect x="638" y="131" width="84" height="186" rx="5" fill="#ffd9a1" fill-opacity="0.75" stroke="#b86810" stroke-width="2"/>
    <rect x="665" y="143" width="30" height="72" fill="#c99f5b" stroke="#7e5f30"/>
    <line x1="680" y1="215" x2="680" y2="275" stroke="#64748b" stroke-width="4"/>
    <rect x="666.2" y="258.5" width="27.6" height="18" fill="#c2791e"/>
    <rect x="671" y="276.5" width="18" height="30" fill="#dc8b26"/>
    <rect x="662" y="278" width="36" height="15" fill="#ed8a7c" stroke="#8c3027"/>
    <rect x="663" y="294.5" width="34" height="15" fill="url(#hatch)" stroke="#64748b"/>
    <rect x="640" y="329" width="110" height="90" rx="4" fill="#d6e4fb" stroke="#527fc2"/>
    <text x="650" y="362" class="small">ESP / 电源</text><text x="650" y="384" class="small">H 桥 / 充电板</text><text x="650" y="406" class="small">分层固定区</text>
    <rect x="637" y="419" width="83.4" height="12" fill="#153f68"/>
    <text x="78" y="421" class="small">前侧 +Y</text>
    <path d="M751 149 L803 132 L820 132" class="leader"/><text x="830" y="137" class="label">电池：底层 Z=3～24</text>
    <path d="M722 192 L803 190 L820 190" class="leader"/><text x="830" y="195" class="label">锁模块：Z=26～48</text>
    <text x="830" y="220" class="small">两层投影重叠，垂直方向分离</text>
    <path d="M698 285 L803 270 L820 270" class="leader"/><text x="830" y="276">锁舌 + 前端承窝</text>
    <path d="M750 379 L803 333 L820 333" class="leader"/><text x="830" y="339">完整电子物料包络</text>
    <path d="M681 425 L803 386 L820 386" class="leader"/><text x="830" y="391">前壁 OLED / 内侧压条</text>
    <text x="830" y="426" class="small">电气仓净宽 43.5</text>
  </g>
  <rect x="30" y="595" width="1140" height="325" rx="12" fill="white" stroke="#d8e0eb"/>
  <text x="50" y="630" class="head">历史共轴尺寸链 · 行程 10.5 · 待替换为偏置驱动布局</text>
  <text x="50" y="655" class="small">锁孔中心 Z=36；栓头 6×6，共轴方案有 Ø3.4 贯通避让孔；承载能力待打印试验</text>
  <!-- Y plotting: origin 350; 20 px/mm -->
  <rect x="470" y="680" width="100" height="180" fill="#fee7e2" stroke="#c96b5f"/>
  <text x="476" y="703" class="small">锁舌 6～11</text>
  <rect x="580" y="680" width="100" height="180" fill="url(#hatch)" stroke="#64748b"/>
  <text x="584" y="703" class="small">承窝 11.5～16.5</text>
  <line x1="50" y1="775" x2="450" y2="775" stroke="#8292a5" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="64" y="795" class="small">固定丝杠 −15～5</text>
  <text x="64" y="736" class="label">退回</text>
  <rect x="130" y="719" width="120" height="35" fill="#b56d1e"/>
  <rect x="250" y="726" width="200" height="21" fill="#edaa4b"/>
  <text x="275" y="743" class="small">栓头末端 5</text>
  <line x1="450" y1="762" x2="470" y2="762" class="dim"/>
  <text x="455" y="820" class="small">1 mm 释放间隙</text>
  <text x="64" y="842" class="label">锁紧</text>
  <rect x="340" y="825" width="120" height="35" fill="#b56d1e"/>
  <path d="M460 832 H644 L660 839 L644 853 H460 Z" fill="#edaa4b" stroke="#b56d1e"/>
  <text x="347" y="848" class="small">主体前端 5.5</text>
  <line x1="660" y1="870" x2="680" y2="870" class="dim"/><text x="615" y="902" class="small">距盲底 1 mm</text>
  <text x="760" y="713" class="label">关键改变</text>
  <text x="760" y="745">① 退回后，栓头与丝杠均退出锁舌路径</text>
  <text x="760" y="775">② 锁紧时，粗主体不进入锁孔</text>
  <text x="760" y="805">③ 承窝完整截面啮合 3.2 mm</text>
  <text x="760" y="835">④ 可拆导轨盖，先装螺母和滑栓</text>
  <text x="760" y="865">⑤ 两端到位检测 + 合盖检测</text>
  <text x="40" y="951">最新要求：开锁 ≤15 秒 / 无外露 USB / 18650 取出充电 / 预算约百元，允许少量超出</text>
  <text x="40" y="980" class="small">此图保留被校核的旧结构；电池座、隔离层及偏置锁模块尺寸以同名 Markdown 的当前设计基线为准。</text>
</svg>
