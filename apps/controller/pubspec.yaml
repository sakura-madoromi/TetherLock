name: tetherlock
description: TetherLock cross-platform control application.
publish_to: none
version: 0.1.0
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  mqtt_client: ^10.11.11
  path_provider: ^2.1.5
  tetherlock_protocol:
    path: ../../packages/protocol-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
