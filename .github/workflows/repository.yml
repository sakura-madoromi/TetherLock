name: Repository boundaries
on: [push, pull_request]
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/repo/check.py --revision HEAD
      - run: git lfs fsck --objects --pointers HEAD
      - run: npm run assets:check
      - run: npm run test:repo
